# Server Port
server.port=8080

# ===================================================================
# 1. SQL DATABASE CONFIGURATION (Supabase PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://<your-supabase-db-host>:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=<your-supabase-password>
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# 2. NOSQL DATABASE CONFIGURATION (MongoDB Atlas)
# ===================================================================
spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/institution_db?retryWrites=true&w=majority
